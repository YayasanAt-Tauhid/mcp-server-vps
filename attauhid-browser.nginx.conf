log_format attauhid_browser_ws '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

# The two session bootstrap documents must be embeddable by ChatGPT Android.
# Its native WebView can put an opaque ancestor above the OpenAI sandbox, which
# cannot be represented in frame-ancestors. These routes stay protected by a
# signed one-use login ticket plus a Secure/HttpOnly/Partitioned session cookie.
# All noVNC assets and every other route keep the strict frame allowlist.
map $uri $attauhid_browser_csp {
    default "frame-ancestors 'self' https://chatgpt.com https://chat.openai.com https://*.web-sandbox.oaiusercontent.com https://claude.ai https://b24062e53cfb5300e9b169bdfc922e5b.claudemcpcontent.com https://bd336c8c8c2db0431f889000419e3619.claudemcpcontent.com https://b83caf37887334e7899e7bd81e779754.claudemcpcontent.com";
    /embed/login "";
    /embed/view "";
}

server {
    listen 127.0.0.1:6081;
    server_name browser-vps.hijrah-attauhid.or.id;
    # Browser control is embeddable only by the configured ChatGPT/Claude hosts.
    # Keep this list in sync with browser-embed-security.js (including extra origins).
    add_header Content-Security-Policy $attauhid_browser_csp always;
    # This endpoint is intentionally embedded cross-origin by trusted MCP hosts.
    # CORP is required by some Android WebView/COEP combinations; CSP/auth still
    # control who can actually use the viewer.
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header Referrer-Policy no-referrer always;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;
    # Do not log signed login URL query strings.
    access_log /var/log/nginx/attauhid-browser-ws.log attauhid_browser_ws;
    auth_basic "Browser At-Tauhid";
    auth_basic_user_file /etc/nginx/attauhid-browser.htpasswd;
    location = /browser/vnc.html {
        auth_basic off;
        return 302 https://browser-vps.hijrah-attauhid.or.id/embed/login;
    }
    location = /embed/login {
        auth_basic off;
        proxy_pass http://127.0.0.1:6082/embed/login;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Cookie $http_cookie;
    }
    location = /embed/view {
        auth_basic off;
        proxy_pass http://127.0.0.1:6082/view;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Cookie $http_cookie;
    }
    location = /embed/mode {
        auth_basic off;
        proxy_pass http://127.0.0.1:6082/mode;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Cookie $http_cookie;
    }
    location = /embed/scroll {
        auth_basic off;
        proxy_pass http://127.0.0.1:6082/scroll;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
    }
    location = /embed/connection {
        auth_basic off;
        proxy_pass http://127.0.0.1:6082/connection;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Cookie $http_cookie;
    }
    location = /embed/_ws_auth {
        internal;
        auth_basic off;
        proxy_pass http://127.0.0.1:6082/auth/ws;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Browser-Request-Uri $request_uri;
        proxy_set_header X-Browser-Upgrade $http_upgrade;
    }
    location = /embed/websockify {
        auth_basic off;
        auth_request /embed/_ws_auth;
        limit_except GET { deny all; }
        # Strip the ticket before proxying; never log its query string.
        access_log /var/log/nginx/attauhid-browser-ws.log attauhid_browser_ws;
        rewrite ^ /websockify? break;
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control no-store always;
    }
    location = /embed/_auth {
        internal;
        auth_basic off;
        proxy_pass http://127.0.0.1:6082/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location /embed/ {
        auth_basic off;
        auth_request /embed/_auth;
        error_page 401 =302 https://browser-vps.hijrah-attauhid.or.id/embed/login;
        rewrite ^/embed/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location /browser/ {
        rewrite ^/browser/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /browser { return 302 /browser/vnc.html; }
    location / { return 404; }
}
