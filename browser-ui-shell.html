<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser Safara</title>
<style>
:root{color-scheme:dark;font:14px system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101827;color:#f4f7ff}
body{display:flex;flex-direction:column;min-height:430px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;background:#19243a;border-bottom:1px solid #34465f}
strong{margin-right:auto}
button,a.action{background:#263b59;border:1px solid #455a78;color:#f5f8ff;border-radius:8px;padding:9px 11px;font:inherit;cursor:pointer;text-decoration:none}
button:disabled{opacity:.5;cursor:wait}
.status{font-size:12px;color:#bcd0ef;padding:7px 12px;background:#101827;min-height:28px}
.viewer{display:flex;position:relative;flex:1;min-height:400px;background:#0c1220}
iframe{border:0;width:100%;height:100%;min-height:400px;background:#0e1525}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:25px;color:#e1eafa;background:#101827}
#empty[hidden]{display:none}
footer{font-size:12px;color:#b9c6da;padding:8px 12px}
@media(max-width:500px){strong{width:100%;text-align:center}button{font-size:12px;padding:8px}}
</style>
</head>
<body>
<header>
<strong>Browser Safara</strong>
<button id="retry" type="button" disabled>Muat ulang</button>
<button id="desktop" type="button" disabled>Desktop</button>
<button id="mobile" type="button" disabled>Mobile</button>
<button id="external" type="button" disabled>Buka layar penuh ↗</button>
</header>
<div class="status" id="status" role="status" aria-live="polite">Menyiapkan panel MCP Apps…</div>
<main class="viewer">
  <iframe id="browser" title="Browser bersama Safara" referrerpolicy="no-referrer" allow="fullscreen"></iframe>
  <div id="empty">Menghubungkan ke browser Safara…</div>
</main>
<footer>Masukkan password dan OTP hanya di layar browser Safara. Jika layar tidak tersedia, pilih “Buka layar penuh”.</footer>
<script>/*__BROWSER_UI_BUNDLE__*/</script>
</body>
</html>
