<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser Safara</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:12px}
.card{max-width:680px;margin:0 auto;border:1px solid rgba(127,127,127,.28);border-radius:18px;padding:18px;background:Canvas;color:CanvasText;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(90,130,255,.12);font-size:23px}
.title{font-size:17px;font-weight:700;line-height:1.2}
.sub{font-size:13px;opacity:.68;margin-top:3px}
.desc{font-size:14px;line-height:1.5;opacity:.84;margin:0 0 16px}
.open{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:50px;padding:0 16px;border-radius:14px;text-decoration:none;font-weight:650;background:rgba(127,127,127,.10);border:1px solid rgba(127,127,127,.24);color:inherit}
.open:active{transform:scale(.995)}
.hint{font-size:12px;opacity:.58;text-align:center;margin:12px 2px 0}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="icon">🖥️</div>
      <div>
        <div class="title">Browser Safara</div>
        <div class="sub">Browser bersama · sesi persisten</div>
      </div>
    </div>
    <p class="desc">Buka browser bersama untuk bekerja bersama AI. Anda dapat memasukkan login langsung di sana.</p>
    <a class="open" href="__BROWSER_VIEW_URL__" target="_blank" rel="noopener noreferrer">
      <span>▣&nbsp;&nbsp;Buka browser Safara</span>
      <span>›</span>
    </a>
    <div class="hint">Login dan cookie tetap memakai sesi Chromium VPS yang sama.</div>
  </div>
</body>
</html>
