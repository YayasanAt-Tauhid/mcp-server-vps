<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser VPS At-Tauhid</title>
<style>
html,body{margin:0;height:100%;font:14px system-ui,sans-serif;background:#151a23;color:#fff}
body{overflow:hidden;display:flex;flex-direction:column;height:var(--panel-height,600px);min-height:160px}
.top{flex:0 0 auto;background:#202938;border-bottom:1px solid #2e394b}
.bar{min-height:44px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:7px 10px}
.brand{font-weight:700;white-space:nowrap}
.status{opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center;font-size:12px}
.controls{display:flex;gap:6px;align-items:center}
.controls button,.bar a{border:1px solid #43516a;background:#29364a;color:#eaf1ff;border-radius:8px;padding:6px 9px;font:inherit;text-decoration:none;white-space:nowrap}
.controls button.active{background:#eaf1ff;color:#182133;border-color:#eaf1ff}
.controls button:disabled{opacity:.45}
.controls button[hidden]{display:none}
.bar a{display:inline-flex;color:#b9d4ff}
.wrap{position:relative;flex:1;min-height:0;background:#0e1219;display:flex;justify-content:center}
.viewport{position:relative;width:100%;height:100%;transition:max-width .18s ease}
.mobile-mode .viewport{max-width:640px;box-shadow:0 0 0 1px #354057}
iframe{display:none;width:100%;height:100%;border:0;background:#111}
.loading{z-index:2;background:#151a23;position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#d8e2f0}
@media (max-width:640px){
  .bar{display:grid;grid-template-columns:1fr auto;gap:6px;padding:8px}
  .brand{grid-area:1/1;font-size:13px;min-width:0}
  .status{grid-area:1/2;text-align:right;font-size:11px;max-width:105px}
  .controls{grid-area:2/1;gap:4px}
  .controls button{min-height:38px;padding:6px;font-size:12px}
  .bar a{grid-area:2/2;justify-content:center;align-items:center;min-height:26px;padding:6px;font-size:12px}
}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <span class="brand">Browser VPS At-Tauhid</span>
    <div class="controls">
      <button id="mode-desktop" type="button" disabled>🖥 Desktop</button>
      <button id="mode-mobile" type="button" disabled>📱 Mobile</button>
      <button id="mode-retry" type="button" hidden>Sambung ulang</button>
      <button id="mode-fullscreen" type="button" disabled title="Layar penuh" aria-pressed="false">⛶ Fullscreen</button>
    </div>
    <span id="status" class="status" role="status">Menyiapkan MCP App…</span>
    <a id="external" href="https://browser-vps.hijrah-attauhid.or.id/embed/login" target="_blank" rel="noopener noreferrer" title="Buka layar terpisah">Buka tab ↗</a>
  </div>
</div>
<div class="wrap">
  <div class="viewport">
    <div id="loading" class="loading">Menghubungkan panel browser…</div>
    <iframe id="browser" title="Browser bersama VPS At-Tauhid" allow="fullscreen"></iframe>
  </div>
</div>
